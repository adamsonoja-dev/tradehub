<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Candleflow market monitor</title>
  <desc id="desc">A stylized trading dashboard with a rising market chart and price markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a26"/>
      <stop offset="1" stop-color="#171513"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b08d4f"/>
      <stop offset="1" stop-color="#e6c88a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="760" cy="70" r="150" fill="#c9a86a" opacity=".08"/>
  <circle cx="120" cy="500" r="180" fill="#7a93b0" opacity=".1"/>
  <g fill="none" stroke="#e9d6a8" opacity=".1">
    <path d="M70 120H830M70 220H830M70 320H830M70 420H830"/>
    <path d="M180 70V470M320 70V470M460 70V470M600 70V470M740 70V470"/>
  </g>
  <g fill="#f4efe6" font-family="Arial, sans-serif">
    <text x="70" y="76" font-size="22" font-weight="700">BTC / USD</text>
    <text x="70" y="105" font-size="14" opacity=".65">Market monitor</text>
    <text x="720" y="80" font-size="26" text-anchor="end" font-weight="700">117,842</text>
    <text x="720" y="105" font-size="14" text-anchor="end" fill="#3daf8b">+2.41%</text>
  </g>
  <path d="M80 405 C140 380 165 425 220 350 S310 370 355 292 S440 320 490 242 S580 270 620 190 S710 215 810 105" fill="none" stroke="#0a0c11" stroke-width="18" opacity=".35"/>
  <path d="M80 405 C140 380 165 425 220 350 S310 370 355 292 S440 320 490 242 S580 270 620 190 S710 215 810 105" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="810" cy="105" r="11" fill="#e6c88a" stroke="#fff" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" opacity=".72">
    <text x="80" y="505">09:00</text><text x="270" y="505">12:00</text><text x="460" y="505">15:00</text><text x="680" y="505">18:00</text>
  </g>
