<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Candleflow order execution</title>
  <desc id="desc">A stylized order ticket showing buy and sell controls beside a price ladder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c1a"/>
      <stop offset="1" stop-color="#151218"/>
    </linearGradient>
  </defs>
  <rect width="760" height="520" rx="34" fill="url(#bg)"/>
  <rect x="55" y="55" width="650" height="410" rx="24" fill="#0c0e13" opacity=".85" stroke="#e9d6a8" stroke-opacity=".14"/>
  <g font-family="Arial, sans-serif" fill="#f4efe6">
    <text x="92" y="105" font-size="23" font-weight="700">Quick order</text>
    <text x="92" y="132" font-size="14" opacity=".58">ETH / USD</text>
    <text x="92" y="190" font-size="42" font-weight="700">4,201.00</text>
    <text x="92" y="220" font-size="14" fill="#3daf8b">Available balance $10,245.50</text>
  </g>
  <rect x="92" y="270" width="270" height="62" rx="12" fill="#3daf8b"/>
  <rect x="392" y="270" width="270" height="62" rx="12" fill="#cf5b68"/>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <text x="227" y="309" fill="#ffffff">BUY</text>
    <text x="527" y="309" fill="#fff">SELL</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#a79e8f">
    <text x="92" y="382">Lot size</text><text x="392" y="382">Stop loss</text>
    <text x="92" y="420" fill="#f4efe6">0.10</text><text x="392" y="420" fill="#f4efe6">Optional</text>
  </g>
  <path d="M610 95h46M610 120h26M610 145h58M610 170h35" stroke="#3daf8b" stroke-width="7" stroke-linecap="round" opacity=".8"/>
</svg>
